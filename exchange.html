    };
    function clsZh(s) {
      if (!s) return "";

        x = x.trim();

    function iconImg(it, cls) {
      var u = iconUrl(it);

    function buildTip(it, rate) {
      var q = qOf(it.q);
      var h = '<div class="ti">' + iconImg(it, "b" + q);
      h += '<div><div class="nm q' + q + '">' + esc(it.n) + '</div>';
      h += '<div class="qlabel q' + q + '">' + esc(QUAL_ZH[q] || "普通") + '</div></div></div>';
      if (it.bd) h += '<div class="row muted">' + esc(it.bd) + '</div>';
      if (it.cl) h += '<div class="row muted">职业：' + esc(clsZh(it.cl)) + '</div>';
      if (it.il) h += '<div class="row itemLevel">物品等级 ' + esc(it.il) + '</div>';
      h += '<div class="hr"></div>';
      var head = [it.sl, it.tp].filter(Boolean).join(" · ");
      if (head) h += '<div class="row muted">' + esc(head) + '</div>';
      if (it.wp) {
        it.wp.split(" / ").forEach(function (seg) {
          if (!seg) return;
          var cls = seg.indexOf("每秒伤害") >= 0 ? "row muted" : "row";
          h += '<div class="' + cls + '">' + esc(seg) + '</div>';
        });
      }
      if (it.ar) h += '<div class="row">' + esc(it.ar) + '</div>';
      if (it.st && it.st.length) {
        h += '<div class="hr"></div>';
        it.st.forEach(function (s) { h += '<div class="row stat">' + esc(s) + '</div>'; });
      }

        h += '<div class="hr"></div>';
        it.ef.forEach(function (s) { h += '<div class="row effect">' + esc(s) + '</div>'; });
      }
      if (it.sn || (it.se && it.se.length)) {
        h += '<div class="hr"></div>';
        if (it.sn) h += '<div class="row spec">' + esc(it.sn) + '</div>';
        if (it.se) it.se.forEach(function (s) { h += '<div class="row spec">' + esc(s) + '</div>'; });
      }
      if (it.du) h += '<div class="row muted">' + esc(it.du) + '</div>';
      if (it.mk && it.mk.length) h += '<div class="row itemLevel">' + esc(it.mk.join(" · ")) + '</div>';
      if (it.rl) h += '<div class="row req">需要等级 ' + esc(it.rl) + '</div>';
      if (rate != null && rate !== "") h += '<div class="row muted">掉率：' + esc(rate) + '%</div>';
      if (it.sp) h += '<div class="row req">售价：' + esc(it.sp) + '</div>';

      return h;

    var tipEl = null, tipVisible = false, curX = 0, curY = 0;
    var TIP_OFFSET = 16;
    function getTip() {
      if (!tipEl) {
        tipEl = document.createElement("div");
        tipEl.className = "tooltip";
        document.body.appendChild(tipEl);
      }
      return tipEl;
    }
    function positionTip() {
      var el = tipEl;
      if (!el || !tipVisible) return;
      var r = el.getBoundingClientRect();
      var x = curX + TIP_OFFSET, y = curY + TIP_OFFSET;
      if (x + r.width > window.innerWidth - 8) x = curX - r.width - TIP_OFFSET;
      if (y + r.height > window.innerHeight - 8) y = curY - r.height - TIP_OFFSET;
      if (x < 8) x = 8;
      if (y < 8) y = 8;
      el.style.left = x + "px";
      el.style.top = y + "px";
    }
    function showTip(html, e) {
      var el = getTip();
      curX = e.clientX; curY = e.clientY;
      el.innerHTML = html;
      el.style.display = "block"; /* 注意：fixed 元素不能用 hidden 属性控制，会退回文档流 */
      el.style.left = "0px";
      el.style.top = "0px";
      tipVisible = true;
      positionTip();
    }
    function hideTip() {
      if (tipEl) tipEl.style.display = "none";
      tipVisible = false;
    }
    function tipOver(e) {
      var el = e.target.closest ? e.target.closest("[data-id]") : null;
      if (!el) return;
      var it = itemById(el.getAttribute("data-id"));
      if (it) showTip(buildTip(it, el.getAttribute("data-rate")), e);
    }
    function tipOut(e) {
      var to = e.relatedTarget;
      if (to && to.closest && to.closest("[data-id]")) return;
      hideTip();
    }

    /* ---------- 数据取用 ---------- */
    function findContent(key) {
      for (var i = 0; i < DATA.modules.length; i++) {
        var cs = DATA.modules[i].contents;
        for (var j = 0; j < cs.length; j++) if (cs[j].key === key) return cs[j];
      }
      return null;
    }
    function setBossOf(content) {
      var bs = (content && content.bosses) || [];
      for (var i = 0; i < bs.length; i++) if (bs[i].kind === "set") return bs[i];
      return null;
    }
    function groupClass(g) {
      /* 组内职业字段实测 100% 一致且齐备，取首件 cl 即整组职业 */
      var first = g.items.length ? itemById(g.items[0][0]) : null;
      return (first && first.cl) || "其他";
    }

    /* ---------- 渲染：副本选择器 ---------- */
    function renderPicker() {
      var sel = $("xc-dungeon");
      sel.innerHTML = "";
      DUNGEONS.forEach(function (d) {
        var c = findContent(d.key);
        if (!c) return;
        var o = document.createElement("option");
        o.value = d.key;
        o.textContent = c.zh + (d.tag ? "（" + d.tag + "）" : "");
        if (d.disabled) o.disabled = true;
        if (d.key === state.dungeon) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = function () {
        var picked = null;
        for (var i = 0; i < DUNGEONS.length; i++) if (DUNGEONS[i].key === this.value) picked = DUNGEONS[i];
        if (!picked || picked.disabled) { this.value = state.dungeon; return; } /* 双保险：禁用项本不可选 */
        state.dungeon = picked.key;
        renderBody();
      };
    }

      + '<thead><tr><th>物品</th><th>等级</th><th>部位</th><th>操作</th></tr></thead><tbody>';

    function rowHtml(id) {
      var it = itemById(id);
      if (!it) return "";
      var q = qOf(it.q);
      return '<tr class="loot-row" data-id="' + esc(id) + '">'
        + '<td class="loot-name q' + q + '"><span class="loot-inner">'
        + '<button type="button" class="sub-toggle" aria-label="展开兑换材料"></button>'
        + iconImg(it, "item-icon") + esc(it.n) + "</span></td>"

        + "</tr>";

    function renderBody() {
      var content = findContent(state.dungeon);
      var boss = setBossOf(content);
      if (!content || !boss || !boss.groups || !boss.groups.length) {
        $("xc-body").innerHTML = '<p class="empty-note">该副本暂无套装数据。</p>';
        $("xc-count").textContent = "";
        return;
      }
      var byClass = {};
      var total = 0, hidden = 0;
      boss.groups.forEach(function (g) {
        /* 尚未采集到兑换数据的套装暂不列出（如圣骑士三套），避免出现空组 */
        var has = g.items.some(function (row) { return !!EXCHANGE_COST[String(row[0])]; });
        if (!has) { hidden++; return; }
        var cls = groupClass(g);
        (byClass[cls] = byClass[cls] || []).push(g);
        total += g.items.length;
      });
      var order = Object.keys(byClass).sort(function (a, b) {
        var ia = CLASS_ORDER.indexOf(a), ib = CLASS_ORDER.indexOf(b);
        if (ia < 0) ia = 99;
        if (ib < 0) ib = 99;
        return ia - ib;
      });
      if (!order.length) {
        $("xc-body").innerHTML = '<p class="empty-note">该副本的套装兑换数据尚未采集。</p>';
        $("xc-count").textContent = "";
        return;
      }
      $("xc-count").textContent = content.zh + " · " + boss.name + " · "
        + (boss.groups.length - hidden) + " 组 · " + total + " 件"
        + (hidden ? "（另有 " + hidden + " 套待采集）" : "");
      var html = "";
      order.forEach(function (cls) {
        var gs = byClass[cls];
        var cnt = gs.reduce(function (a, g) { return a + g.items.length; }, 0);
        html += '<h2 class="slot-h">' + esc(cls) + ' <span>' + gs.length + " 组 · " + cnt + " 件</span></h2>";
        gs.forEach(function (g) {
          /* 数据里的 label 自带「（9 件）」后缀，剥掉后由 em 统一渲染，避免重复 */
          var plainLabel = String(g.label).replace(/（\s*\d+\s*件\s*）\s*$/, "");
          html += '<details class="fold-group"><summary>' + esc(plainLabel)
            + " <em>" + g.items.length + " 件</em></summary>"
            + '<table class="loot-table">' + XC_HEAD;
          g.items.forEach(function (row) { html += rowHtml(row[0]); });
          html += "</tbody></table></details>";
        });
      });
      $("xc-body").innerHTML = html;
    }

        img.className = "item-icon q" + qOf(mat.q);
        var u = iconUrl(mat);
        if (u) { img.src = u; img.loading = "lazy"; } else { img.style.visibility = "hidden"; }
        line.appendChild(img);
        var nm = document.createElement("span");
        nm.className = "q" + qOf(mat.q) + " sub-name";
        nm.textContent = mat.n + " ×" + c.count;
        line.appendChild(nm);
        wrap.appendChild(line);
        grid.appendChild(wrap);
      });
      panel.appendChild(grid);
      return panel;
    }

    /* ---------- 购物车 ---------- */
    function cartQty() { return cart.reduce(function (a, e) { return a + e.qty; }, 0); }
    function addToCart(id) {
      var e = null;
      for (var i = 0; i < cart.length; i++) if (cart[i].id === String(id)) e = cart[i];
      if (e) e.qty += 1; else cart.push({ id: String(id), qty: 1 });
      renderCart();
      bumpCartBtn();
    }
    function renderCart() {
      var n = cartQty();
      var badge = $("xc-cart-badge");
      badge.textContent = n;
      badge.style.display = n > 0 ? "" : "none";
      $("xc-cart-num").textContent = n ? n + " 件" : "";
      var items = $("xc-cart-items");
      if (!cart.length) {
        items.innerHTML = '<p class="xc-empty">购物车为空。点击装备行右侧「＋ 加入」把装备丢进来。</p>';
      } else {
        var h = "";
        cart.forEach(function (e) {
          var it = itemById(e.id);
          if (!it) return;
          h += '<div class="xc-line">'
            + iconImg(it, "item-icon")
            + '<span class="xc-line-name q' + qOf(it.q) + '" data-id="' + esc(e.id) + '">' + esc(it.n) + "</span>"
            + '<span class="xc-step">'
            + '<button type="button" class="xc-step-btn" data-act="dec" data-id="' + esc(e.id) + '" aria-label="减少一件">−</button>'
            + '<span>' + e.qty + "</span>"
            + '<button type="button" class="xc-step-btn" data-act="inc" data-id="' + esc(e.id) + '" aria-label="增加一件">＋</button>'
            + "</span></div>";
        });
        items.innerHTML = h;
      }
      renderSummary();
    }
    /* 材料汇总：同种材料合并计数，数量按件数倍数累加；尚未采集数据的装备单独列出 */
    function renderSummary() {
      var mats = {}, noData = [];
      cart.forEach(function (e) {
        var cs = costOf(e.id);
        if (!cs) { noData.push(e); return; }
        cs.forEach(function (c) {
          mats[c.mat] = (mats[c.mat] || 0) + c.count * e.qty;
        });
      });
      var ids = Object.keys(mats).sort(function (a, b) { return mats[b] - mats[a]; });
      var mh = "";
      ids.forEach(function (mid) {
        var mat = itemById(mid);
        if (!mat) return;
        mh += '<div class="xc-mat-line" data-id="' + esc(mid) + '">'
          + iconImg(mat, "item-icon")
          + '<span class="q' + qOf(mat.q) + '">' + esc(mat.n) + "</span>"
          + '<b class="xc-mat-n">×' + mats[mid] + "</b></div>";
      });
      var box = $("xc-cart-mats");
      box.innerHTML = mh || '<p class="xc-empty">暂无材料。</p>';
      if (noData.length) {
        var names = noData.map(function (e) {
          var it = itemById(e.id);
          return it ? it.n : ("#" + e.id);
        });
        var p = document.createElement("p");
        p.className = "xc-empty";
        p.textContent = "另有 " + noData.length + " 件尚未采集兑换数据，未计入材料：" + names.join("、");
        box.appendChild(p);
      }
    }
    /* 步进器：只改数量与汇总，不重建列表 DOM（保持按钮焦点，连点不费劲；减到 0 整行移除） */
    function stepLine(id, delta) {
      var e = null;
      for (var i = 0; i < cart.length; i++) if (cart[i].id === String(id)) e = cart[i];
      if (!e) return;
      e.qty += delta;
      if (e.qty <= 0) { cart.splice(cart.indexOf(e), 1); renderCart(); return; }
      var nameEl = document.querySelector('#xc-cart-items .xc-line-name[data-id="' + id + '"]');
      var line = nameEl ? nameEl.closest(".xc-line") : null;
      if (line) line.querySelector(".xc-step span").textContent = e.qty;
      renderSummary();
      var n = cartQty();
      var badge = $("xc-cart-badge");
      badge.textContent = n;
      badge.style.display = n > 0 ? "" : "none";
      $("xc-cart-num").textContent = n ? n + " 件" : "";
    }
    function toggleCart(open) {
      var p = $("xc-cart-panel"), b = $("xc-cart-btn");
      var willOpen = open == null ? !p.classList.contains("xc-open") : open;
      p.classList.toggle("xc-open", willOpen);
      b.setAttribute("aria-expanded", willOpen ? "true" : "false");
    }
    function bumpCartBtn() {
      var b = $("xc-cart-btn");
      b.classList.remove("xc-pop");
      /* 重启动画 */
      void b.offsetWidth;
      b.classList.add("xc-pop");
    }

    /* ---------- 飞行动画：图标从按钮位置沿缓动弧线落入购物车 ---------- */
    function flyToCart(srcEl, it) {
      var btn = $("xc-cart-btn");
      var a = srcEl.getBoundingClientRect(), b = btn.getBoundingClientRect();
      var x0 = a.left + a.width / 2, y0 = a.top + a.height / 2;
      var x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
      var el = document.createElement(it.ic || it.icn ? "img" : "div");
      el.className = "xc-fly item-icon q" + qOf(it.q);
      var u = iconUrl(it);
      if (u) el.src = u;
      document.body.appendChild(el);
      var W = 28, arc = Math.min(140, 60 + Math.abs(y1 - y0) * 0.2), dur = 620;
      function place(x, y, k, o) {
        el.style.transform = "translate(" + (x - W / 2) + "px," + (y - W / 2) + "px) scale(" + k + ")";
        el.style.opacity = o;
      }
      place(x0, y0, 1, 1);
      var t0 = null;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var t = Math.min(1, (ts - t0) / dur);
        /* easeInOutCubic：起步轻推、中段加速、收尾减速，配抛物线弧度更像被“丢”过去 */
        var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        var x = x0 + (x1 - x0) * e;
        var y = y0 + (y1 - y0) * e - Math.sin(t * Math.PI) * arc;
        var k = 1 - 0.6 * e;
        var o = t > 0.82 ? Math.max(0, 1 - (t - 0.82) / 0.18) : 1;
        place(x, y, k, o);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          el.remove();
          bumpCartBtn();
        }
      }
      requestAnimationFrame(frame);
    }

    /* ---------- 事件 ---------- */
    /* 列表区：箭头展开材料 / ＋ 号加入购物车 */
    $("xc-body").addEventListener("click", function (e) {
      var add = e.target.closest ? e.target.closest("button.xc-add") : null;
      if (add) {
        var tr = add.closest("tr.loot-row");
        var id = add.getAttribute("data-id");
        var it = itemById(id);
        if (it) {
          var icon = tr ? tr.querySelector(".item-icon") : null;
          flyToCart(icon || add, it);
          addToCart(id);
        }
        return;
      }
      var btn = e.target.closest ? e.target.closest("button.sub-toggle") : null;
      if (!btn) return;
      var row = btn.closest("tr.loot-row");
      if (!row) return;
      var next = row.nextElementSibling;
      if (next && next.classList.contains("xc-cost-row")) {
        var hidden = next.style.display === "none";
        next.style.display = hidden ? "" : "none";
        btn.dataset.open = hidden ? "1" : "0";
        return;
      }
      var tr2 = document.createElement("tr");
      tr2.className = "xc-cost-row sub-row";
      var td = document.createElement("td");
      td.colSpan = 4;
      td.appendChild(buildCostPanel(row.getAttribute("data-id")));
      tr2.appendChild(td);
      row.parentNode.insertBefore(tr2, row.nextSibling);
      btn.dataset.open = "1";
    });

    /* 购物车：开关 / 步进 / 清空 */
    $("xc-cart-btn").addEventListener("click", function () { toggleCart(); });
    $("xc-cart-close").addEventListener("click", function () { toggleCart(false); });
    $("xc-cart-clear").addEventListener("click", function () { cart = []; renderCart(); });
    $("xc-cart-panel").addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("button.xc-step-btn") : null;
      if (!btn) return;
      var line = btn.closest(".xc-line");
      if (!line) return;
      var id = btn.getAttribute("data-id");
      stepLine(id, btn.getAttribute("data-act") === "inc" ? 1 : -1);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") toggleCart(false);
    });

    /* tooltip：document 级 mousemove + 滚动隐藏（前任事故：fixed tooltip 不能用 hidden 属性控制） */
    document.addEventListener("mousemove", function (e) {
      curX = e.clientX; curY = e.clientY;
      if (tipVisible) positionTip();
    });
    $("xc-body").addEventListener("mouseover", tipOver);
    $("xc-body").addEventListener("mouseout", tipOut);
    $("xc-cart-panel").addEventListener("mouseover", tipOver);
    $("xc-cart-panel").addEventListener("mouseout", tipOut);
    $("xc-body").addEventListener("mouseleave", hideTip);
    window.addEventListener("scroll", function () { if (tipVisible) hideTip(); }, true);

    /* ---------- 启动 ---------- */
    renderCart();
    /* 数据文件多源加载（与掉落查询页同策略）：GitHub Pages 到国内线路对本站大文件极慢
       （实测 539KB 跑 60 秒仅下到 320KB），jsDelivr 的 gcore 节点同文件 2.3 秒。
       按顺序试各源，每个 12 秒超时；并校验 meta.wiki_version 与本页版本一致，防止 CDN 旧缓存。 */
    var ASSET_V = (function () {
      var l = document.querySelector('link[href*="style.css?v="]');
      var m = l && l.getAttribute("href").match(/[?&]v=([\d.]+)/);
      return m ? m[1] : "";
    })();
    /* CDN 引用用「具体 commit hash」而不是 @main：jsDelivr 对分支引用的解析有数小时延迟
       （purge 只清文件缓存，清不掉它内部的 分支→commit 映射），换成 hash 才能保证发版后
       CDN 立刻拿到新数据。发布脚本在提交数据后会把 DATA_REF 替换为该 hash。 */
    var DATA_REF = "6949583";
    var DATA_URLS = [
      "https://gcore.jsdelivr.net/gh/Addons-SoD/wow-sod-wiki@" + DATA_REF + "/assets/loot-data.json?v=" + ASSET_V,
      "https://cdn.jsdelivr.net/gh/Addons-SoD/wow-sod-wiki@" + DATA_REF + "/assets/loot-data.json?v=" + ASSET_V,
      "assets/loot-data.json?v=" + ASSET_V
    ];
    /* 并行竞速：三个源同时发请求，第一个「版本校验通过」的胜出，其余立即中止。
       若所有源都失败、或版本都不符，则退回「版本不符但内容可用」的那一份，避免白屏
       （CDN 缓存更新有延迟，刚发版后的短时间内会走到这条兜底路径）。 */
    function loadLootData() {
      return new Promise(function (resolve, reject) {
        var pending = DATA_URLS.length, settled = false, ctrls = [], stale = null;
        function win(d) {
          if (settled) return;
          settled = true;
          ctrls.forEach(function (c) { try { c.abort(); } catch (e) {} });
          resolve(d);
        }
        function lose() {
          if (settled) return;
          if (--pending <= 0) {
            settled = true;
            if (stale) { resolve(stale); return; }   /* 兜底：旧数据也好过打不开 */
            reject(new Error("所有数据源均不可用"));
          }
        }
        DATA_URLS.forEach(function (url) {
          var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
          if (ctrl) ctrls.push(ctrl);
          var timer = setTimeout(function () { if (ctrl) ctrl.abort(); lose(); }, 15000);
          fetch(url, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
            .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
            .then(function (d) {
              clearTimeout(timer);
              var v = (d.meta && d.meta.wiki_version) || "";
              if (ASSET_V && v !== ASSET_V) {
                if (!stale) stale = d;
                throw new Error("数据版本 " + (v || "未知") + " 与页面 " + ASSET_V + " 不符");
              }
              win(d);
            })
            .catch(function () { clearTimeout(timer); lose(); });
        });
      });
    }
    loadLootData()
      .then(function (d) {
        DATA = d;
        ICON_TPL = (d.meta && d.meta.icon_cdn) || "https://render.worldofwarcraft.com/classic1x-us/icons/56/%s.jpg";
        ICON_TPL_NUM = (d.meta && d.meta.icon_cdn_num) || "https://render.worldofwarcraft.com/icons/56/%s.jpg";
        renderPicker();
        renderBody();
      })
      .catch(function (e) {
        $("xc-body").innerHTML = '<p class="empty-note">数据加载失败：' + esc(e.message) + "。请刷新重试。</p>";
      });
  </script>
</body>
</html>
