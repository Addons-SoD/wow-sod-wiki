<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>符文指南 · 魔兽世界探索赛季 Wiki</title>
  <meta name="description" content="探索赛季（SoD）符文指南：按职业与装备槽位整理各符文效果与获取方式" />
  <link rel="preload" as="image" href="assets/bg.jpeg" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-card">
      <a class="hero-back" href="./">← 返回 Wiki 首页</a>
      <h1>探索赛季 · 符文指南</h1>
      <p>按职业与装备槽位整理各符文的解锁、效果与获取方式</p>
    </div>
  </header>

  <main>
    <div class="notice">
      符文（Rune）铭刻于特定装备槽位，为职业带来全新技能与被动。本页按
      <strong>职业 → 槽位</strong> 组织，数据整理自玩家社区资料，正在逐步填充中。
    </div>

    <div id="class-tabs"></div>

    <table id="rune-table">
      <thead>
        <tr><th>槽位</th><th>符文名称</th><th>效果说明</th><th>获取 / 解锁方式</th><th>阶段</th></tr>
      </thead>
      <tbody id="rune-body"></tbody>
    </table>
  </main>

  <footer>
    <p>本 Wiki 为玩家社区项目，与暴雪娱乐（Blizzard Entertainment）无隶属关系。<span class="site-version" id="site-version"></span></p>
  </footer>

  <script src="assets/version.js"></script>

  <script>
    // 数据格式：[槽位, 符文名, 效果说明, 获取方式, 阶段(P1/P2/P3/P4/P5)]
    const RUNES = {
      "战士": [],
      "圣骑士": [],
      "猎人": [],
      "潜行者": [],
      "牧师": [],
      "萨满祭司": [],
      "法师": [],
      "术士": [],
      "德鲁伊": []
    };

    const CLASS_TABS = ["战士", "圣骑士", "猎人", "潜行者", "牧师", "萨满祭司", "法师", "术士", "德鲁伊"];
    let current = CLASS_TABS[0];

    function renderTabs() {
      const box = document.getElementById("class-tabs");
      box.innerHTML = "";
      CLASS_TABS.forEach(function (cls) {
        const btn = document.createElement("button");
        btn.textContent = cls;
        btn.className = cls === current ? "active" : "";
        btn.onclick = function () { current = cls; renderTabs(); renderTable(); };
        box.appendChild(btn);
      });
    }

    function renderTable() {
      const body = document.getElementById("rune-body");
      const rows = RUNES[current] || [];
      body.innerHTML = "";
      if (!rows.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.className = "empty";
        td.textContent = "「" + current + "」的符文数据整理中，敬请期待。";
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      rows.forEach(function (r) {
        const tr = document.createElement("tr");
        [r[0], r[1], r[2], r[3], r[4]].forEach(function (cell, i) {
          const td = document.createElement("td");
          if (i === 1) td.className = "rune-name";
          if (i === 0) td.className = "slot";
          if (i === 4) {
            const span = document.createElement("span");
            span.className = "phase-tag";
            span.textContent = cell || "-";
            td.appendChild(span);
          } else {
            td.textContent = cell || "-";
          }
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    renderTabs();
    renderTable();
  </script>
</body>
</html>
